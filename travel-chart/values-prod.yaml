  className: nginx
  hosts:
    - host: travel.prod.example.com
      paths:
        - path: /
          pathType: Prefix
config:
  NODE_ENV: production
  API_URL: https://api.prod.example.com
serviceAccount:
  name: travel-s3-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/travel-app-prod-s3-role
secretStore:
  provider: aws
  region: us-east-1
