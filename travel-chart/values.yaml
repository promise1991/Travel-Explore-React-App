replicaCount: 1

image:
  repository: promiseopah/travelapp-kubernetes
  tag: "v1"
  pullPolicy: IfNotPresent

env:
  environment: development
  apiUrl: https://api.dev.travel.com

service:
  type: NodePort
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

secret:
  mapsApiKey: "dev-key-12345-placeholder"