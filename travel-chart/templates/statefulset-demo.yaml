apiVersion: v1
kind: Service
metadata:
  name: travel-headless
  labels:
    app: travel-headless
spec:
  clusterIP: None
  selector:
    app: travel-stateful
  ports:
  - port: 80
    name: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: travel-stateful
spec:
  serviceName: travel-headless
  replicas: 2
  selector:
    matchLabels:
      app: travel-stateful
  template:
    metadata:
      labels:
        app: travel-stateful
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: data
          mountPath: /usr/share/nginx/html
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: standard
      resources:
        requests:
          storage: 1Gi
