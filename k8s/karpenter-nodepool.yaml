apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: free-tier-micro
spec:
  template:
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["t3"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["micro"]  # FREE TIER ONLY - blocks t3.large that failed
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]  # free tier spot not always free
      nodeClassRef:
        name: free-tier-micro
      expireAfter: 720h
  limits:
    cpu: 12
    memory: 12Gi
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s
---
apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: free-tier-micro
spec:
  amiFamily: AL2023
  role: ${module.karpenter.node_iam_role_name}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: travel-eks-prod
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: travel-eks-prod
  tags:
    karpenter.sh/discovery: travel-eks-prod
