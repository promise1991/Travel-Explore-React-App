name: Build -> ECR -> GitOps
on:
  push:
    branches: [main]
permissions:
  id-token: write
  contents: write
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::842746302640:role/github-ecr-push
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Build and Push to ECR
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/travel-app:$TAG .
          docker push $REGISTRY/travel-app:$TAG
      - name: Update Helm values-prod.yaml (GitOps)
        run: |
          sed -i "s/tag:.*/tag: ${{ github.sha }}/" travel-chart/values-prod.yaml
          cat travel-chart/values-prod.yaml | grep -A2 image:
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add travel-chart/values-prod.yaml
          git commit -m "deploy: ${{ github.sha }}" || true
          git push
